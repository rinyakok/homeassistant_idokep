# Organization and project key are passed by .github/workflows/ci.yml.
sonar.sources=custom_components/idokep
sonar.tests=tests

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/*.png,**/*.svg,**/__pycache__/**,**/*.pyc
sonar.test.exclusions=tests/fixtures/**
sonar.cpd.exclusions=tests/**
