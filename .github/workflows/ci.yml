name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional: SonarQube Cloud runs only where this secret is set.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Home Assistant tests with coverage
        run: |
          python -m pytest \
            --cov=custom_components/idokep \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85
      - name: SonarQube Cloud analysis
        # Skipped when the secret is missing: pull requests from forks,
        # Dependabot runs, and repositories without SonarQube Cloud.
        if: env.SONAR_TOKEN != '' && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          # Organization and project key follow the repository owner, so the
          # same workflow works for the upstream repository and for forks.
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
